<!-- Zvětšená fotografie -->
<dialog id="lightbox" class="photo-lightbox">
    <button type="button" id="close-lightbox" aria-label="Zavřít fotografii">✕</button>
    <img id="lightbox-image" alt="Zvětšená fotografie">
</dialog>

<script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const closeButton = document.getElementById("close-lightbox");

    document.querySelectorAll(".photo-gallery img").forEach(photo => {
        photo.tabIndex = 0;
        photo.setAttribute("role", "button");
        photo.setAttribute("aria-label", "Zvětšit fotografii");

        function openPhoto() {
            lightboxImage.src = photo.src;
            lightboxImage.alt = photo.alt;
            lightbox.showModal();
        }

        photo.addEventListener("click", openPhoto);

        photo.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openPhoto();
            }
        });
    });

    closeButton.addEventListener("click", () => lightbox.close());

    lightbox.addEventListener("click", event => {
        if (event.target === lightbox) lightbox.close();
    });
</script>
